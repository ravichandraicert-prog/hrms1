<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading HRMS</title>

<style>

body{

    margin:0;
    padding:0;

    background:#1565C0;

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    font-family:Segoe UI;

}

.container{

    text-align:center;

}

h1{

    margin-top:20px;

    font-size:32px;

}

p{

    font-size:18px;

    margin-top:15px;

}

.loader{

    width:60px;

    height:60px;

    border:6px solid rgba(255,255,255,.3);

    border-top:6px solid white;

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin:auto;

}

@keyframes spin{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}

</style>

</head>

<body>

<div class="container">

<div class="loader"></div>

<h1>HRMS</h1>

<p>Loading Application...</p>

</div>

</body>

</html>
